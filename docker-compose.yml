services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatfits
      POSTGRES_USER: whatfits
      POSTGRES_PASSWORD: whatfits
    ports:
      - "5432:5432"
    volumes:
      - whatfits_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatfits -d whatfits"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://whatfits:whatfits@db:5432/whatfits
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  whatfits_pg:
